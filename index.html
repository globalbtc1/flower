<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Akuarium 3D</title>
<style>

<body>
<canvas id="c" tabindex="0" role="img" aria-label="Akuarium tiga dimensi dengan ikan, batu, dan tanaman air"></canvas>
<div id="load" role="status"><i aria-hidden="true"></i><p>Mengisi akuarium…</p></div>
<div id="ui">
  <p id="hint"><span class="fine">Seret — putar · roda mouse — zum · klik air — beri makan</span><span class="coarse">Jari — putar · cubit — zum · sentuh — beri makan</span></p>
  <div id="bar" role="toolbar" aria-label="Kontrol akuarium">
    <button id="bFeed" type="button"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="5" cy="6" r="1.7"/><circle cx="11" cy="4.5" r="1.4"/><circle cx="15.5" cy="8.5" r="1.7"/><circle cx="8.5" cy="11" r="1.5"/><circle cx="13" cy="14.5" r="1.4"/><circle cx="5.5" cy="15.5" r="1.3"/></svg><span>Beri Makan</span></button>
    <button id="bLight" type="button" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15.6 12.4A6.6 6.6 0 0 1 7.6 4.4a.6.6 0 0 0-.8-.7 7.6 7.6 0 1 0 9.5 9.5.6.6 0 0 0-.7-.8z"/></svg><span id="lightLabel">Malam</span></button>
    <button id="bFollow" type="button" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M1.5 10c2.2-3.3 5-5 8-5 2.6 0 4.9 1.300 6.800 3.600L19 6.500v7l-2.700-2.100c-1.900 2.300-4.200 3.600-6.800 3.600-3 0-5.800-1.700-8-5zm5.200-1.200a1.200 1.200 0 1 0 0 2.400 1.200 1.200 0 0 0 0-2.400z" fill-rule="evenodd"/></svg><span id="followLabel">Ikuti</span></button>
    <button id="bReset" type="button" aria-label="Reset tampilan" title="Reset tampilan"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3.500a6.500 6.500 0 1 1-6.200 4.600l1.700.5A4.700 4.700 0 1 0 10 5.300v2.200L6.300 4.400 10 1.300z"/></svg></button>
  </div>
  <div id="live" class="sr" aria-live="polite"></div>
</div>

function boxFaces(buf, x0, x1, y0, y1, z0, z1, ex, faces = 'xXyYzZ') {
  const f = (p, n, uvs) => { const b = buf.vc; p.forEach((q, i) => buf.vert(q[0], q[1], q[2], n[0], n[1], n[2], uvs[i][0], uvs[i][1], ...ex)); buf.quad(b, b + 1, b + 2, b + 3); };
  const uv = [[0, 0], [1, 0], [1, 1], [0, 1]];
  if (faces.includes('Z')) f([[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], [0, 0, 1], uv);
  if (faces.includes('z')) f([[x1, y0, z0], [x0, y0, z0], [x0, y1, z0], [x1, y1, z0]], [0, 0, -1], uv);
  if (faces.includes('X')) f([[x1, y0, z1], [x1, y0, z0], [x1, y1, z0], [x1, y1, z1]], [1, 0, 0], uv);
  if (faces.includes('x')) f([[x0, y0, z0], [x0, y0, z1], [x0, y1, z1], [x0, y1, z0]], [-1, 0, 0], uv);
  if (faces.includes('Y')) f([[x0, y1, z1], [x1, y1, z1], [x1, y1, z0], [x0, y1, z0]], [0, 1, 0], uv);
  if (faces.includes('y')) f([[x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1]], [0, -1, 0], uv);
}

  boxFaces(buf, -CAB.hx, CAB.hx, CAB.bottom, CAB.top, -CAB.hz, CAB.hz, [1, 0, 0, 0], 'xXYzZ');

}

// ---- Vallisneria: long ribbons reaching the surface ----
function addVallis(buf, x, z, n, rng, o) {

      const side = V3.norm(V3.add(V3.scale(side0, Math.cos(tw)), V3.scale(cr, Math.sin(tw))));
      const nrm = V3.cross(side, dir);

  }

function addSmallLeaf(buf, base, dirOut, up, len, hw, col, phase, sw, hf, droop) {

// ---- rosette plants with broad leaves (sword, crypt, anubias) ----
function addRosette(buf, x, z, rng, o) {
  const y0 = (o.y !== undefined ? o.y : sandH(x, z)) - 0.2;
  const phase = rng() * 30;
  for (let i = 0; i < o.count; i++) {
    const t = i / o.count;                       // 0 inner/young .. 1 outer/old
    const az = i * 2.39996 + rng.range(-0.25, 0.25);

      if (p[1] < sandH(clamp(p[0], X0, X1), clamp(p[2], Z0, Z1)) + 0.4) p[1] = sandH(clamp(p[0], X0, X1), clamp(p[2], Z0, Z1)) + 0.4;

function makeProfile(pts) {
  const n = pts.length, xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  const d = [], m = new Array(n);
  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], h = Math.hypot(a, b);
    if (h > 3) { m[i] = 3 * a / h * d[i]; m[i + 1] = 3 * b / h * d[i]; }
  }
  return (x) => {
    x = clamp(x, xs[0], xs[n - 1]);
    let i = 0; while (i < n - 2 && x > xs[i + 1]) i++;
    const h = xs[i + 1] - xs[i], t = (x - xs[i]) / h, t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * ys[i] + (t3 - 2 * t2 + t) * h * m[i] + (-2 * t3 + 3 * t2) * ys[i + 1] + (t3 - t2) * h * m[i + 1];
  };
}

function buildFishMesh(sp) {
  const L = sp.len;
  const top = makeProfile(sp.top), bot = makeProfile(sp.bot), wid = makeProfile(sp.wid);
  const cen = sp.cen ? makeProfile(sp.cen) : () => 0;
  const s0 = sp.nose;
  const nose = (s) => { if (s >= s0) return 1; const t = 1 - s / s0; return Math.sqrt(Math.max(0, 1 - t * t)); };
  const P = [], A = [], idxB = [], idxF = [];
  const vert = (x, y, z, a0, a1, a2, a3) => { P.push(x, y, z); A.push(a0, a1, a2, a3); return P.length / 3 - 1; };
  const xOf = (s) => (0.5 - s) * L;
  const ez = sp.ez || 1.2, ey = 0.92;
  // ---- body ----
  const NR = 46, M = 24;
  const sv = [];
  for (let i = 0; i < NR; i++) { const t = i / (NR - 1); sv.push(t < 0.3 ? 0.3 * Math.pow(t / 0.3, 1.7) : t); }
  sv[NR - 1] = 1.0;
  for (let i = 0; i < NR; i++) {
    const s = sv[i], nz = nose(s);
    const tp = top(s) * nz * L, bt = bot(s) * nz * L, c = cen(s) * L;
    let w = wid(s) * nz * L;
    if (i === NR - 1) w *= 0.25;
    for (let k = 0; k < M; k++) {
      const th = (k / M) * TAU, cy = Math.cos(th), sz = Math.sin(th);
      const Y = Math.sign(cy) * Math.pow(Math.abs(cy), ey), Z = Math.sign(sz) * Math.pow(Math.abs(sz), ez);
      vert(xOf(s), c + (Y >= 0 ? tp : bt) * Y, w * Z, s, Y, Z, 0);
    }
  }
  for (let i = 0; i < NR - 1; i++) for (let k = 0; k < M; k++) {
    const a = i * M + k, b = i * M + (k + 1) % M, c2 = (i + 1) * M + k, d = (i + 1) * M + (k + 1) % M;
    idxB.push(a, d, b, a, c2, d);
  }
  // tail cap
  { const cc = vert(xOf(1) - 0.01 * L, cen(1) * L, 0, 1, 0, 0, 0); const i = NR - 1; for (let k = 0; k < M; k++) idxB.push(i * M + (k + 1) % M, i * M + k, cc); }
  // surface point helper (side z at given s and height offset y as fraction of L from centreline)
  const surfZ = (s, yf) => {
    const nzv = nose(s), tp = top(s) * nzv, bt = bot(s) * nzv;
    const cy = clamp(yf >= 0 ? yf / tp : yf / bt, -0.98, 0.98);
    const cth = Math.sign(cy) * Math.pow(Math.abs(cy), 1 / ey);
    const sth = Math.sqrt(Math.max(0, 1 - cth * cth));

  if (sp.eye) {

    const zs = surfZ(e.s, e.y);
    for (const sd of [1, -1]) {

      for (let i = 0; i <= RI; i++) {
        const ph = (i / RI) * (PI * 0.62);
        for (let k = 0; k < SE; k++) {
          const th = (k / SE) * TAU;

        }
      }
      for (let i = 0; i < RI; i++) for (let k = 0; k < SE; k++) {
        const a = b + i * SE + k, bq = b + i * SE + (k + 1) % SE, c2 = b + (i + 1) * SE + k, d = b + (i + 1) * SE + (k + 1) % SE;

  const nBodyVerts = P.length / 3;
  // ---- fins ----
  const grid = (ni, nj, fn, part, sBase) => {
    const b = P.length / 3;
    for (let i = 0; i <= ni; i++) for (let j = 0; j <= nj; j++) {
      const u = i / ni, v = j / nj; const p = fn(u, v);
      vert(p[0], p[1], p[2], typeof sBase === 'function' ? sBase(u) : sBase, v, u, part);

    for (let i = 0; i < ni; i++) for (let j = 0; j < nj; j++) {

    if (f.type === 'median') {
      const hp = makeProfile(f.h);

        const s = lerp(f.s0, f.s1, u), ang = lerp(f.ang[0], f.ang[1], u), len = hp(u) * L;

        return [xOf(s) - Math.sin(ang) * len * vv - f.curve * vv * vv * len, by + f.side * Math.cos(ang) * len * vv, 0];
      }, f.part, (u) => lerp(f.s0, f.s1, u));
    } else if (f.type === 'caudal') {
      const lp = makeProfile(f.len);
      const tp = top(1) * L, bt = bot(1) * L, c = cen(1) * L;
      grid(f.ni, f.nj, (u, v) => {

      }, f.part, 1.0);
    } else if (f.type === 'paired') {
      for (const sd of [1, -1]) {
        const s = f.s;
        let B;
        if (f.belly) B = [xOf(s), cen(s) * L - bot(s) * L * 0.86, sd * wid(s) * L * 0.38];
        else B = [xOf(s), (cen(s) + f.y) * L, sd * surfZ(s, f.y) * (f.zf || 0.9)];
        const m = V3.norm([-f.dir[0], -f.dir[1], sd * f.dir[2]]);
        const up = [0, 1, 0];
        const u1 = V3.norm(V3.sub(up, V3.scale(m, V3.dot(up, m))));
        const baseW = (f.baseW || 0.045) * L, len = f.len * L, droop = f.droop || 0;
        grid(f.ni, f.nj, (u, v) => {
          const ph = (u - 0.5) * f.fan;
          const d = V3.norm(V3.add(V3.scale(m, Math.cos(ph)), V3.scale(u1, Math.sin(ph))));
          const ll = len * (f.fan > 0.3 ? 0.62 + 0.38 * Math.sin(PI * u) : 1) * v;
          const w = f.fan > 0.3 ? 1 : (1 - 0.7 * v);
          return [B[0] + u1[0] * (u - 0.5) * baseW * w + d[0] * ll - droop * v * v * len * 0.5, B[1] + u1[1] * (u - 0.5) * baseW * w + d[1] * ll, B[2] + u1[2] * (u - 0.5) * baseW * w + d[2] * ll];

}

const VS_FISH = GLSL_HEAD + `
layout(location=0) in vec3 aPos; layout(location=1) in vec3 aNor; layout(location=2) in vec4 aA;
uniform mat4 uModel; uniform vec4 uSwim; uniform vec4 uFin;
out vec3 vP; out vec3 vN; out vec4 vA; out vec3 vT;
void main(){
  float L = uSwim.w, part = aA.w;
  vec3 p = aPos, n = aNor;
  float sx = 0.5 - p.x / L;
  // paired fins paddle about their base
  if (part > 3.5 && part < 5.5){
    float w = aA.y * aA.y;
    float ph = part > 4.5 ? uFin.z + aA.z * 1.4 : uFin.x * 0.6 + aA.z * 2.0;
    float am = part > 4.5 ? 0.085 : 0.030;
    p += n * (L * am * w * sin(ph) * uFin.w);
  }
  // travelling body wave (amplitude envelope after Videler) + C-bend while turning
  float sc = min(sx, 1.0), se = max(sx - 1.0, 0.0);
  float env = 0.02 - 0.08 * sc + 0.16 * sc * sc + 0.07 * se;
  float denv = sx < 1.0 ? (-0.08 + 0.32 * sc) : 0.07;
  float k = 5.6, th = k * sx - uSwim.x;
  float c = uSwim.y * env * sin(th);
  float dc = uSwim.y * (denv * sin(th) + env * k * cos(th));
  float bx = max(sx - 0.15, 0.0);
  c += uSwim.z * 0.22 * bx * bx; dc += uSwim.z * 0.44 * bx;
  // soft fin membranes ripple and trail
  if (part > 0.5 && part < 3.5){
    float a = aA.y;
    float w = part < 1.5 ? a * a * 0.050 + a * 0.008 : a * a * 0.032;
    c += uFin.y * w * (sin(uFin.x + sx * 8.0 + a * 2.2 + aA.z * 3.0) + 0.5 * sin(uFin.x * 1.7 + aA.z * 9.0 + a * 4.0));
  }
  float m = -dc, q = inversesqrt(1.0 + m * m);
  vec3 pd = vec3(p.x - p.z * m * q, p.y, c * L + p.z * q);
  vec3 nd = vec3((n.x - n.z * m) * q, n.y, (n.x * m + n.z) * q);
  vec4 w4 = uModel * vec4(pd, 1.0);
  w4.y = min(w4.y, WL - 0.06);
  vP = w4.xyz; vN = mat3(uModel) * nd; vA = aA; vT = mat3(uModel) * vec3(q, 0.0, m * q);
  gl_Position = uVP * w4;
}`;

const FS_FISH = `
in vec3 vP; in vec3 vN; in vec4 vA; in vec3 vT;
uniform vec4 uC0; uniform vec4 uC1; uniform vec4 uC2; uniform vec4 uScl; uniform vec4 uEye;
float hash21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float band(float x, float c, float w, float f){ return 1.0 - smoothstep(w - f, w + f, abs(x - c)); }
// what a fish flank mirrors under water: bright window above, blue water around, dim sand below
vec3 envW(vec3 R, vec3 P){
  vec3 up = sunAt(P) * 0.9;
  vec3 side = fogColAt(P.y) * 1.5 + uAmbSky.rgb * 0.30;
  vec3 dn = uAmbGnd.rgb * 1.1;
  vec3 c = mix(side, up, smoothstep(0.15, 0.9, R.y));
  return mix(c, dn, smoothstep(-0.1, -0.75, R.y));
}
// imbricate scales: p.x grows toward the tail, head-most disc lies on top
// returns x = distance to own free edge, y = distance behind the edge of the scale in front, z = id
vec3 scaleAt(vec2 p, out vec2 g){
  float bx = 1e3, br = 0.0, sh = 1.0; vec2 bc = vec2(0.0), bd = vec2(0.0);
  float j0 = floor(p.y + 0.5);
  for (int dj = -1; dj <= 1; dj++){
    float j = j0 + float(dj);
    float off = mod(j, 2.0) * 0.5;
    float i0 = floor(p.x - off + 0.5);
    for (int di = -1; di <= 1; di++){
      vec2 c = vec2(i0 + float(di) + off, j);
      vec2 d = (p - c) * vec2(1.0, 1.12);
      float r = length(d);
      if (r < 0.80){ if (c.x < bx){ bx = c.x; br = r; bc = c; bd = d; } }
      else if (d.x > 0.0) sh = min(sh, r - 0.80);
    }
  }
  g = bd / 0.80;
  return vec3(0.80 - br, sh, hash21(bc));
}

void pattern(float s, float Y, float Zs, float sid, vec3 V, vec3 N, out vec3 alb, out float silver, out vec3 sTint, out vec4 neon){
  alb = vec3(0.4); silver = 0.4; sTint = vec3(1.0); neon = vec4(0.0);
  float vs = max(dot(N, V), 0.0);
#if SPECIES == 0
  vec3 backC = toLin(vec3(0.36, 0.30, 0.16));

  float st = band(Y, yc, 0.15, 0.045) * smoothstep(0.03, 0.07, s) * (1.0 - smoothstep(0.76, 0.86, s));
  float low = 1.0 - smoothstep(yc - 0.17, yc - 0.07, Y);

  float head = low * (1.0 - smoothstep(0.17, 0.27, s));
  alb = mix(backC, red, redM);
  alb = mix(alb, wht, max(belly, head));
  alb = mix(alb, backC * 0.55, smoothstep(0.78, 1.0, Y));
  silver = 0.12 + 0.55 * max(belly, head);
  vec3 nc = mix(vec3(0.02, 0.42, 1.0), vec3(0.04, 1.0, 0.82), smoothstep(0.45, 1.0, vs));
  neon = vec4(nc, st);
#elif SPECIES == 1
  vec3 base = toLin(vec3(0.80, 0.81, 0.78));
  vec3 backC = toLin(vec3(0.50, 0.45, 0.28));
  alb = mix(base, backC, smoothstep(0.25, 1.0, Y) * 0.80);
  alb = mix(alb, alb * 0.72, smoothstep(0.80, 1.0, abs(Y)));
  alb = mix(alb, toLin(vec3(0.66, 0.56, 0.28)), (1.0 - smoothstep(0.12, 0.32, s)) * smoothstep(0.0, 0.8, Y) * 0.65);
  float n = texture(uNoise, vec2(s * 0.9, Y * 0.31)).r - 0.5;
  float sb = s + n * 0.014;
  float bars = band(sb + 0.012 * Y * Y, 0.145, 0.020, 0.012)
             + band(sb, 0.345, 0.018, 0.014) * 0.92
             + band(sb, 0.475, 0.010, 0.014) * 0.25
             + band(sb - 0.02 * Y, 0.605, 0.036, 0.018)
             + band(sb, 0.80, 0.010, 0.016) * 0.22
             + band(sb, 0.965, 0.040, 0.020);
  bars = clamp(bars, 0.0, 1.0);
  alb = mix(alb, vec3(0.010, 0.010, 0.012), bars * 0.95);
  silver = 0.62 * (1.0 - bars * 0.9);
#elif SPECIES == 2
  vec3 blue = toLin(vec3(0.06, 0.14, 0.60));
  vec3 dark = toLin(vec3(0.05, 0.04, 0.10));
  alb = mix(blue, dark, 1.0 - smoothstep(0.10, 0.30, s));
  alb = mix(alb, alb * 0.45, smoothstep(0.5, 1.0, Y));
  alb = mix(alb, toLin(vec3(0.50, 0.05, 0.14)), smoothstep(0.74, 1.0, s) * 0.5);
  vec3 ir = mix(vec3(0.20, 0.30, 1.0), vec3(0.05, 0.80, 0.95), smoothstep(0.35, 0.95, vs));
  silver = 0.38 * smoothstep(0.12, 0.3, s);
  sTint = ir * 1.5;
  neon = vec4(ir, 0.26 * smoothstep(0.18, 0.34, s) * (0.4 + 0.6 * sid));
#elif SPECIES == 3
  vec3 front = toLin(vec3(0.56, 0.57, 0.46));
  vec3 backC = toLin(vec3(0.32, 0.33, 0.22));
  alb = mix(front, backC, smoothstep(0.2, 0.9, Y));

  sTint = mix(vec3(1.0), uC0.rgb * 2.0 + 0.2, rear * 0.7);

  float t = s * 15.0 - Y * 1.3;
  float st = smoothstep(0.50, 0.66, abs(fract(t) - 0.5) * 2.0);

  alb = mix(alb, wht, smoothstep(-0.35, -0.9, Y) * 0.8);
  float t = clamp((s - 0.45) / 0.55, 0.0, 1.0);
  float hh = mix(0.50, 0.10, pow(t, 0.8)), yc = mix(-0.10, 0.02, t);

  alb = mix(alb, vec3(0.010, 0.011, 0.020), wedge * 0.96);
  float gold = band(Y, yc + hh + 0.07, 0.035, 0.03) * smoothstep(0.42, 0.5, s) * (1.0 - smoothstep(0.9, 1.0, s));

  sTint = vec3(1.0, 0.86, 0.74);
  neon = vec4(vec3(1.0, 0.62, 0.20), gold * 0.5);
#else
  vec3 base = toLin(vec3(0.88, 0.80, 0.68));
  vec3 backC = toLin(vec3(0.60, 0.55, 0.44));
  alb = mix(base, backC, smoothstep(0.2, 1.0, Y) * 0.7);

  const a = M4.transformPoint(R.ivp, [nx, ny, -1]), b = M4.transformPoint(R.ivp, [nx, ny, 1]);
  return { o: a, d: V3.norm(V3.sub(b, a)), nx, ny };
}
function feedAt(cx, cy) {
  const ray = screenRay(cx, cy), o = ray.o, d = ray.d;
  let t0 = 0, t1 = 1e9;
  const mn = [X0, 0, Z0], mx = [X1, WL, Z1];
  for (let i = 0; i < 3; i++) {
    if (Math.abs(d[i]) < 1e-6) { if (o[i] < mn[i] || o[i] > mx[i]) return false; continue; }
    let a = (mn[i] - o[i]) / d[i], b = (mx[i] - o[i]) / d[i]; if (a > b) { const q = a; a = b; b = q; }
    t0 = Math.max(t0, a); t1 = Math.min(t1, b);
  }
  if (t0 >= t1) return false;
  // where the ray crosses the surface if it does, otherwise the middle of its path through the water
  let t = (t0 + t1) / 2;
  const ts = (WL - o[1]) / (Math.abs(d[1]) > 1e-6 ? d[1] : 1e-6);
  if (ts >= t0 - 0.01 && ts <= t1 + 0.01) t = ts;
  dropFood(o[0] + d[0] * t, o[2] + d[2] * t, 12);
  return true;
}
function touchUI() { VIEW.idle = 0; if (!VIEW.hintDone) { VIEW.hintDone = true; const h = document.getElementById('hint'); if (h) h.classList.add('off'); } }
function setFollow(idx) {
  VIEW.followIdx = idx;
  const btn = document.getElementById('bFollow'), lab = document.getElementById('followLabel'), live = document.getElementById('live');
  if (idx < 0) {
    VIEW.follow = null;
    if (btn) btn.setAttribute('aria-pressed', 'false'); if (lab) lab.textContent = 'Ikuti';
    if (live) live.textContent = 'Tampilan biasa';
    return;
  }
  // the fish of that species nearest to the front glass makes the best subject
  let best = null;
  for (const f of FISH.list) if (f.sp === idx && (!best || f.pos[2] > best.pos[2])) best = f;
  VIEW.follow = best;
  VIEW.zoom = clamp(best.len * 6.2 / CAM.fit, 0.17, 0.5);
  if (btn) btn.setAttribute('aria-pressed', 'true'); if (lab) lab.textContent = FISH_NAMES[idx];
  if (live) live.textContent = 'Kamera mengikuti: ' + FISH_NAMES[idx];
}
function resetView() {
  setFollow(-1);
  VIEW.az = VIEW.home.az + Math.round((VIEW.az - VIEW.home.az) / TAU) * TAU; VIEW.el = VIEW.home.el; VIEW.zoom = 1; VIEW.target = VIEW.home.target.slice(); VIEW.vaz = VIEW.vel = 0;
}
function setNight(on) {
  VIEW.night = on;
  const btn = document.getElementById('bLight'), lab = document.getElementById('lightLabel'), live = document.getElementById('live');
  if (btn) btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  if (live) live.textContent = on ? 'Lampu malam' : 'Cahaya siang';
}

function initInteraction(canvas) {
  VIEW.reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  VIEW.perf.auto = !/hq/.test(location.hash);
  const P = VIEW.pointers;
  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    P.set(e.pointerId, { x: e.clientX, y: e.clientY });
    VIEW.moved = 0; VIEW.downT = performance.now(); VIEW.down = { x: e.clientX, y: e.clientY, multi: P.size > 1, button: e.button, shift: e.shiftKey };
    if (P.size === 2) { const [a, b] = [...P.values()]; VIEW.pinchD = Math.hypot(a.x - b.x, a.y - b.y); VIEW.pinchC = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }
    VIEW.vaz = VIEW.vel = 0; touchUI();
  });
  canvas.addEventListener('pointermove', (e) => {
    const p = P.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
    VIEW.moved += Math.abs(dx) + Math.abs(dy); touchUI();
    if (P.size === 1) {
      if (VIEW.down && (VIEW.down.button === 2 || VIEW.down.button === 1 || VIEW.down.shift)) { panBy(dx, dy); return; }
      const k = 0.0052 * (0.35 + 0.65 * VIEW.zoom);
      VIEW.az -= dx * k; VIEW.el = clamp(VIEW.el + dy * k * 0.8, -0.12, 1.02);
      VIEW.vaz = -dx * k * 60; VIEW.vel = dy * k * 0.8 * 60;
    } else if (P.size === 2) {
      const [a, b] = [...P.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y), c = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      const rect = canvas.getBoundingClientRect();
      if (VIEW.pinchD > 0 && d > 0) zoomAbout(((c.x - rect.left) / rect.width) * 2 - 1, 1 - ((c.y - rect.top) / rect.height) * 2, VIEW.pinchD / d);
      if (VIEW.pinchC) panBy(c.x - VIEW.pinchC.x, c.y - VIEW.pinchC.y);
      VIEW.pinchD = d; VIEW.pinchC = c;
    }
  });
  const up = (e) => {
    if (!P.has(e.pointerId)) return;
    P.delete(e.pointerId);
    const quick = performance.now() - VIEW.downT < 350 && VIEW.moved < 7;
    if (e.type === 'pointerup' && quick && VIEW.down && !VIEW.down.multi && VIEW.down.button === 0 && P.size === 0) { VIEW.vaz = VIEW.vel = 0; feedAt(e.clientX, e.clientY); }
    if (performance.now() - (VIEW.lastMove || 0) > 80) { VIEW.vaz = VIEW.vel = 0; }
    VIEW.pinchD = 0; VIEW.pinchC = null;
  };
  canvas.addEventListener('pointermove', () => { VIEW.lastMove = performance.now(); });
  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const dy = e.deltaMode === 1 ? e.deltaY * 32 : e.deltaY;
    zoomAbout(((e.clientX - rect.left) / rect.width) * 2 - 1, 1 - ((e.clientY - rect.top) / rect.height) * 2, Math.exp(clamp(dy, -240, 240) * (e.ctrlKey ? 0.008 : 0.0016)));
    touchUI();
  }, { passive: false });
  canvas.addEventListener('keydown', (e) => {
    let used = true;
    const st = 0.09;
    if (e.key === 'ArrowLeft') VIEW.az += st; else if (e.key === 'ArrowRight') VIEW.az -= st;
    else if (e.key === 'ArrowUp') VIEW.el = clamp(VIEW.el + st * 0.7, -0.12, 1.02); else if (e.key === 'ArrowDown') VIEW.el = clamp(VIEW.el - st * 0.7, -0.12, 1.02);
    else if (e.key === '+' || e.key === '=') zoomAbout(0, CAM.shift, 0.85); else if (e.key === '-' || e.key === '_') zoomAbout(0, CAM.shift, 1 / 0.85);
    else if (e.key === 'Home' || e.key === '0') resetView();
    else used = false;
    if (used) { e.preventDefault(); touchUI(); }
  });
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener('click', () => { fn(); touchUI(); }); };
  on('bFeed', () => {
    const rng = FISH.rng;
    let x = rng.range(-34, 34), z = rng.range(-4, 13);
    if (VIEW.follow) { x = VIEW.follow.pos[0] + rng.range(-8, 8); z = VIEW.follow.pos[2] + rng.range(-5, 5); }
    dropFood(x, z, 24);
    const live = document.getElementById('live'); if (live) live.textContent = 'Makanan di dalam air';
  });
  on('bLight', () => setNight(!VIEW.night));
  on('bFollow', () => { let i = VIEW.followIdx + 1; if (i >= SPECIES.length) i = -1; setFollow(i); if (i < 0) { VIEW.zoom = 1; VIEW.target = VIEW.home.target.slice(); } });
  on('bReset', resetView);
  document.addEventListener('visibilitychange', () => { APP.paused = document.hidden || !!APP.lost; VIEW.perf.last = 0; });
  canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); APP.lost = true; APP.paused = true; });
  canvas.addEventListener('webglcontextrestored', () => location.reload());
  setTimeout(() => { if (!VIEW.hintDone) { const h = document.getElementById('hint'); if (h) h.classList.add('off'); VIEW.hintDone = true; } }, 14000);
  VIEW.init = true;
}

function updateView(time, dt, wall) {
  // ---- light preset ----
  const kL = 1 - Math.exp(-dt * 2.2), tgt = VIEW.night ? NIGHT : DAY;
  for (let i = 0; i < 3; i++) ENV.sunCol[i] += (tgt.sun[i] - ENV.sunCol[i]) * kL;
  ENV.lamp += (tgt.lamp - ENV.lamp) * kL; ENV.exposure += (tgt.exp - ENV.exposure) * kL; ENV.caust += (tgt.caust - ENV.caust) * kL;
  ENV.night = clamp((1 - ENV.lamp) / (1 - NIGHT.lamp), 0, 1);
  // ---- adaptive quality: step the resolution down if frames stay slow ----
  const pf = VIEW.perf;
  if (pf.auto && wall !== undefined) {
    const fdt = pf.last ? wall - pf.last : 0; pf.last = wall;
    if (!pf.t0) pf.t0 = wall;
    if (wall - pf.t0 < 1.2 || APP.frames < 4) { /* warm-up: shaders are still being compiled */ }
    else if (pf.skip > 0) pf.skip--;
    else if (fdt > 0 && fdt < 8) {
      pf.acc += fdt; pf.n++;
      // judge after 45 frames, or sooner when frames are really slow
      if (pf.n >= 45 || (pf.acc > 2.5 && pf.n >= 4)) {
        const avg = pf.acc / pf.n; pf.acc = 0; pf.n = 0;
        if (avg > 0.030 && pf.step < 4) {
          pf.step = Math.min(4, pf.step + (avg > 0.060 ? 2 : 1)); pf.skip = avg > 0.2 ? 3 : 12;
          R.scale = [1, 0.8, 0.64, 0.5, 0.4][pf.step];
          if (pf.step >= 3) R.quality = 0;
          if (pf.step >= 4 && R.samples > 2) { R.samples = 2; R.rebuild = true; }
        }
      }
    }
  }
  if (APP.userCam) return;
  // ---- camera ----
  const P = VIEW.pointers;
  VIEW.idle += dt;
  if (P.size === 0) {
    VIEW.az += VIEW.vaz * dt; VIEW.el = clamp(VIEW.el + VIEW.vel * dt, -0.12, 1.02);
    const dk = Math.exp(-dt * 3.2); VIEW.vaz *= dk; VIEW.vel *= dk;
    if (VIEW.idle > 7 && !VIEW.reduced && !VIEW.follow) {
      const ease = clamp((VIEW.idle - 7) / 4, 0, 1);
      VIEW.swayPh += dt * 0.085;
      VIEW.az += Math.cos(VIEW.swayPh) * 0.020 * ease * dt;
    }
  }
  const tg = VIEW.target;
  if (VIEW.follow) {
    const f = VIEW.follow, kf = 1 - Math.exp(-dt * 2.0);
    tg[0] += (f.pos[0] - tg[0]) * kf; tg[1] += (f.pos[1] - tg[1]) * kf; tg[2] += (f.pos[2] - tg[2]) * kf;
  } else if (VIEW.zoom > 0.8) {
    const kb = (1 - Math.exp(-dt * 3)) * sstep(0.8, 1.0, VIEW.zoom);
    for (let i = 0; i < 3; i++) tg[i] += (VIEW.home.target[i] - tg[i]) * kb;
  }
  const k = VIEW.init && APP.frames > 2 ? 1 - Math.exp(-dt * 11) : 1;
  CAM.az += (VIEW.az - CAM.az) * k; CAM.el += (VIEW.el - CAM.el) * k;
  let dist = CAM.fit * VIEW.zoom;
  for (let i = 0; i < 3; i++) CAM.target[i] += (tg[i] - CAM.target[i]) * k;
  // never let the lens enter the glass box
  const B = viewBasis();
  for (let i = 0; i < 60; i++) {
    const cx = CAM.target[0] + B.b[0] * dist, cy = CAM.target[1] + B.b[1] * dist, cz = CAM.target[2] + B.b[2] * dist;
    if (Math.abs(cx) > TW / 2 + 5 || Math.abs(cz) > TD / 2 + 5 || cy > TH + 7) break;
    dist += 2.5;
  }
  CAM.dist += (dist - CAM.dist) * k;
}

// debug: let eased values settle instantly (used by automated screenshots)
function snapView() { for (let i = 0; i < 80; i++) updateView(APP.time, 0.05); }
// ============================================================
//  Main
// ============================================================
function buildScene() {
  R.noiseTex = buildNoiseTex();
  SCENE.opaque.push({ prog: 'sand', mesh: buildSand(), shadow: false });
  for (const m of buildPebbleMeshes()) SCENE.opaque.push({ prog: 'peb', mesh: m, shadow: true });
  SCENE.opaque.push({ prog: 'rock', mesh: buildRocks(), shadow: true });
  buildTank();
  if (typeof buildExtraScene === 'function') buildExtraScene();
}

const APP = { time: 0, last: 0, paused: false, userTime: null, frames: 0, userCam: false, idle: 0 };

function resize() {
  const canvas = gl.canvas;
  let dpr = Math.min(window.devicePixelRatio || 1, R.dprCap || 2);
  const pix = canvas.clientWidth * canvas.clientHeight * dpr * dpr;
  if (pix > R.maxPix) dpr *= Math.sqrt(R.maxPix / pix);     // keep the frame within a sane pixel budget on 4K / retina screens
  const cw = Math.max(2, Math.floor(canvas.clientWidth * dpr * R.scale)), ch = Math.max(2, Math.floor(canvas.clientHeight * dpr * R.scale));
  if (canvas.width !== cw || canvas.height !== ch || !R.T || R.rebuild) {
    R.rebuild = false;
    canvas.width = cw; canvas.height = ch;
    setupTargets(cw, ch);
    CAM.fit = fitDistance(cw / ch, canvas.clientHeight);
    if (typeof onAspect === 'function') onAspect(cw / ch);
    if (!APP.userCam) CAM.dist = CAM.fit;
  }
}

function frame(now) {
  const t = now / 1000;
  let dt = Math.min(0.05, Math.max(0.001, t - APP.last)); APP.last = t;
  if (APP.userTime !== null) { dt = 1 / 60; APP.time = APP.userTime; } else APP.time += dt;
  resize();
  if (typeof updateView === 'function') updateView(APP.time, dt, t);
  if (typeof updateSim === 'function') updateSim(APP.time, dt);
  renderFrame(APP.time, dt);
  APP.frames++;
  if (APP.frames === 2) hideLoader();
}
function tick(now) {
  if (APP.dead) return;
  requestAnimationFrame(tick);
  if (APP.paused) return;
  try { frame(now); APP.errs = 0; }
  catch (e) {
    console.error(e);
    if ((APP.errs = (APP.errs || 0) + 1) > 3) { APP.dead = true; showFail('Terjadi kesalahan saat menggambar. Coba muat ulang halaman.'); }
  }
}

function hideLoader() {
  const el = document.getElementById('load'); if (!el || el.classList.contains('off')) return;
  el.classList.add('off'); setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 800);
}
function showFail(msg) {
  const ld = document.getElementById('load'); if (ld && ld.parentNode) ld.parentNode.removeChild(ld);
  const ui = document.getElementById('ui'); if (ui) ui.style.display = 'none';
  const fb = document.getElementById('fallback'); fb.style.display = 'flex';
  if (msg) fb.querySelector('p').textContent = msg;
}
function start() {
  const canvas = document.getElementById('c');
  gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, powerPreference: 'high-performance' });
  if (!gl) { showFail(); return; }
  const go = () => {
    try {
      initRenderer();
      buildScene();
      resize();
      if (typeof initInteraction === 'function') initInteraction(canvas);
      window.AQ = { CAM, ENV, APP, R, SCENE, FISH, inspectFish, dropFood, simRun, VIEW, snapView, setFollow, setNight, setView(az, el, dist, tx, ty, tz) { CAM.az = az; CAM.el = el; if (dist) CAM.dist = dist; if (tx !== undefined) CAM.target = [tx, ty, tz]; APP.userCam = true; },
        caustStats() { gl.bindFramebuffer(gl.FRAMEBUFFER, R.caustFBO); const b = new Uint8Array(CAUST_SIZE * CAUST_SIZE * 4); gl.readPixels(0, 0, CAUST_SIZE, CAUST_SIZE, gl.RGBA, gl.UNSIGNED_BYTE, b); let s = [0, 0, 0], mx = 0, sat = 0; for (let i = 0; i < b.length; i += 4) { s[0] += b[i]; s[1] += b[i + 1]; s[2] += b[i + 2]; if (b[i + 1] > 250) sat++; } const n = b.length / 4; gl.bindFramebuffer(gl.FRAMEBUFFER, null); return { mean: s.map((v) => v / n / 255 * 6), sat: sat / n }; } };
      requestAnimationFrame(tick);
    } catch (e) {
      console.error(e);
      showFail(String(e.message || e).slice(0, 400));
    }
  };
  // let the loading screen paint before the (synchronous) scene build
  let started = false;
  const once = () => { if (started) return; started = true; go(); };
  requestAnimationFrame(() => setTimeout(once, 0));
  setTimeout(once, 400);
}
start();

})();
</script>
